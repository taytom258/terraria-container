name: AutoBuild

on:
  push:
    branches:
      - 'main'
      - 'dev'
    paths:
      - '**/run.sh'
      - 'Dockerfile'
      - '**/AutoBuild.yml'
    tags:
      - v**
  pull_request:

env:
  TEST_TAG: ghcr.io/${{ github.repository }}:test

permissions:
  packages: write
  
jobs:
  build_test:
    runs-on: [ubuntu-latest]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
    
      - name: Validate build configuration
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          call: check
    
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          load: true
          tags: ${{ env.TEST_TAG }}

      - name: Test vanilla server
        run: |
          docker run -e WORLD=/opt/terraria/test.wld -e TEST=true --rm ${{ env.TEST_TAG }}
      
      - name: Test tshock server
        run: |
          docker run -e TYPE=tshock -e WORLD=/opt/terraria/test.wld -e TEST=true --rm ${{ env.TEST_TAG }}
          
      - name: Docker Meta - main
        if: github.ref_name == 'main' || github.ref_type == 'tag'
        id: meta
        uses: docker/metadata-action@v6
        with:
          flavor: |
            latest=false
          images: |
            ${{ vars.DOCKERHUB_OWNER }}/${{ vars.REPOSITORY }}
            ghcr.io/${{ github.repository }}
          tags: |
            latest
            type=semver,pattern={{version}}

      - name: Docker Meta - dev
        if: github.ref_name == 'dev'
        id: meta-dev
        uses: docker/metadata-action@v6
        with:
          flavor: |
            latest=false
          images: |
            ${{ vars.DOCKERHUB_OWNER }}/${{ vars.REPOSITORY }}
            ghcr.io/${{ github.repository }}
          tags: |
            dev

      - name: Build and push - main
        if: github.ref_name == 'main' || github.ref_type == 'tag'
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      
      - name: Build and push - dev
        if: github.ref_name == 'dev'
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-dev.outputs.tags }}
          labels: ${{ steps.meta-dev.outputs.labels }}
